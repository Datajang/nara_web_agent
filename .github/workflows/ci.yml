# PR 게이트 (SPEC §12.8). 실패하면 병합하지 않는다.
# DB 테스트는 실제 PostgreSQL 16 (SQLite 금지, §12.1). E2E는 P2 이후에 추가한다.
name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nara
          POSTGRES_PASSWORD: nara-ci
          POSTGRES_DB: nara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nara" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nara:nara-ci@127.0.0.1:5432/nara_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check . ../eval
      - name: Ruff format
        run: uv run ruff format --check . ../eval
      - name: Mypy
        run: uv run mypy app ../eval
      - name: Pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build
