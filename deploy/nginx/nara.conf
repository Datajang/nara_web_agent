# nara v2 (SPEC §11.4). nara.example.com은 설치 때 실제 도메인으로 바꾼다(docs/ops/INSTALL.md).
# 보안 헤더는 snippets/nara-security.conf를 모든 location에서 include한다.
# (location에 add_header가 하나라도 있으면 서버 수준 헤더가 상속되지 않는다)
server {
  listen 443 ssl http2;
  server_name nara.example.com;
  ssl_certificate     /etc/letsencrypt/live/nara.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nara.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  root /opt/nara/frontend/dist;
  client_max_body_size 1m;

  # 점검 경로는 서버 안(127.0.0.1:8010)에서만 부른다
  location = /healthz { return 404; }
  location = /readyz { return 404; }

  location /api/ {
    include snippets/nara-security.conf;
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 클라이언트가 보낸 X-Forwarded-For를 이어 붙이지 않고 실제 접속 IP로 덮어쓴다
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location /assets/ {
    include snippets/nara-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    include snippets/nara-security.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

server {
  listen 80;
  server_name nara.example.com;
  server_tokens off;
  # 인증서 발급·갱신은 certbot --standalone(갱신 때 nginx를 잠깐 멈춤, docs/ops/INSTALL.md)
  return 301 https://$host$request_uri;
}
